<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link href="src/css/style.css" rel="stylesheet">
</head>

<body data-theme="dark">
  <div class="workspace">
    <div class="topbar">
      <div>PixelMatrix</div>
      <div class="tabbar" id="tabbar">
        <i class="nf nf-fa-code" id="tabbar-code"></i>
        <i class="nf nf-md-file_export" id="tabbar-output"></i>
      </div>
      <div class="top-interactives" id="top-interactives">
        <div id="top-settings" class="input-group">
          <div id="setting-language" class="tui-select" data-selected="rhai">
            <div class="tui-select-trigger">Language</div>
            <div class="tui-select-dropdown" id="setting-language">
              <div class="tui-select-option selected" data-value="rhai">Rhai</div>
            </div>
          </div>
          <div id="setting-output-type" class="tui-select" data-selected="grid">
            <div class="tui-select-trigger">Output</div>
            <div class="tui-select-dropdown" id="setting-output-type">
              <div class="tui-select-option selected" data-value="grid">Grid</div>
            </div>
          </div>
          <label class="checkbox" data-tip="Automatically runs the script when it changes">
            <input type="checkbox" name="hot-reload" id="setting-hot-reload">
            <span>Hot reload</span>
          </label>
          <label class="checkbox" data-tip="Disables the automatic tip box">
            <input type="checkbox" name="disable-tip" id="setting-disable-tip">
            <span>Disable tips</span>
          </label>
        </div>
        <button id="help-btn">?</button>
        <div id="top-tools" class="input-group">
          <button id="run-btn">Run</button>
          <button id="clear-btn">Clear</button>
        </div>
      </div>
      <div class="top-menu-btn" id="top-menu-btn">⚙</div>
    </div>

    <div id="in-out-container" class="in-out-container">
      <div class="editor-container" id="editor-container"></div>

      <div class="output-container" id="output-container">
        <div class="output-toolbar" id="output-toolbar"></div>
        <div class="output-inner" id="output-inner"></div>
      </div>

      <div class="middle-icon" id="middle-icon" data-tip="Press to run script"></div>
    </div>

    <div id="console-grid-placeholder"> <!-- relative positioned item in the workspace grid -->
      <div id="console" class="console"> <!-- absolut postioned wrapper that resizes with drag handle -->
        <div id="console-header" class="console-header">
          <div data-tip="Will show output of the script generated by print or debug statements.">Console</div>
          <div id="console-handle" class="console-handle">=====</div>
        </div>
        <div id="console-inner" class="console-inner">
          <div id="console-scroll" class="console-scroll">
            <div id="console-spacer"></div>
          </div>
          <div id="console-content" class="console-content"></div>
        </div>
      </div>
    </div>

    <div class="help-modal" id="help-modal">
      <div class="help-inner">
        <span class="help-top">
          <span>Help</span>
          <span class="help-close-btn" id="help-close-btn">X</span>
        </span>
        <div class="help-content" id="help-content">
          <button id="help-show-tip-btn">Show specific tip</button>
          <button id="help-show-tutorial-btn">Start Tutorial</button>
        </div>
      </div>
    </div>

    <div class="error-pop" id="error-pop">
      <diV class="error-pop-inner">
        <span class="error-pop-title">Error</span>
        <div class="error-pop-content" id="error-pop-content"></div>
      </diV>
    </div>

    <div class="tip-box" id="tip-box">
      <div class="tip-inner">
        <span class="tip-top">
          <span>Tip</span>
          <span class="tip-close-btn" id="tip-close-btn">X</span>
        </span>
        <div class="tip-content" id="tip-content"></div>
      </div>
    </div>

    <div class="tutorial-border" id="tutorial-border"></div>
    <div class="tutorial-overlay-container" id="tutorial-overlay-container">
      <div class="tutorial-overlay" id="tutorial-overlay-top"></div>
      <div class="tutorial-overlay" id="tutorial-overlay-right"></div>
      <div class="tutorial-overlay" id="tutorial-overlay-bottom"></div>
      <div class="tutorial-overlay" id="tutorial-overlay-left"></div>
    </div>

    <div class="tutorial-box" id="tutorial-box">
      <div class="tutorial-inner">
        <span class="tutorial-top">
          <span>Tutorial</span>
          <span class="tutorial-close-btn" id="tutorial-close-btn">X</span>
        </span>
        <div class="tutorial-content" id="tutorial-content"></div>
        <div class="tutorial-button-container" id="tutorial-button-container">
          <button id="tutorial-previous-btn">Previous</button>
          <button id="tutorial-next-btn">Next</button>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="src/ts/app.js"></script>
  <!-- External JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</body>

</html>
